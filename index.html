<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Powered Plant Health Analytics Engine</title>
<style>
:root{--green:#14532d;--green2:#198754;--lime:#dcfce7;--ink:#17231b;--muted:#64746a;--bg:#f5f8f5;--line:#e1e9e2;--white:#fff;--orange:#f59e0b;--red:#dc5454;--shadow:0 12px 35px rgba(19,65,35,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;font-weight:800;color:var(--green);font-size:17px}.logo{width:39px;height:39px;border-radius:13px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:22px}.nav{display:flex;gap:8px;align-items:center}.nav button,.linkbtn{background:transparent;color:#435348;padding:10px 13px;border-radius:10px;font-weight:600}.nav button:hover,.nav button.active{background:var(--lime);color:var(--green)}.primary{background:var(--green);color:#fff;padding:12px 18px;border-radius:11px;font-weight:700}.primary:hover{background:#0d4022}.secondary{background:#edf5ee;color:var(--green);padding:11px 16px;border-radius:10px;font-weight:700}.danger{background:#fff0f0;color:#b42323;padding:9px 12px;border-radius:9px;font-weight:700}.container{max-width:1180px;margin:auto;padding:32px 22px}.hero{background:linear-gradient(110deg,rgba(7,48,25,.94),rgba(20,83,45,.78)),url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1800&q=85') center/cover;color:#fff;padding:78px 7%;border-radius:0 0 28px 28px;min-height:440px;display:flex;align-items:center}.hero-inner{max-width:680px}.eyebrow{display:inline-flex;background:rgba(255,255,255,.15);padding:8px 12px;border-radius:30px;font-size:13px;font-weight:700;letter-spacing:.3px}.hero h1{font-size:clamp(36px,5vw,58px);line-height:1.07;margin:20px 0}.hero p{font-size:18px;line-height:1.7;color:#e1f1e5;max-width:600px}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.hero .secondary{background:#fff}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:38px 0 18px}.section-head h2{margin:0;color:var(--green);font-size:27px}.section-head p{margin:6px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.grid.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:var(--shadow)}.feature-icon{width:48px;height:48px;border-radius:14px;background:var(--lime);display:grid;place-items:center;font-size:24px}.card h3{margin:14px 0 7px}.card p{color:var(--muted);line-height:1.6;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);padding:20px;border-radius:16px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:29px;color:var(--green);margin-top:8px}.page-title{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.page-title h1{margin:0;color:var(--green);font-size:30px}.page-title p{margin:6px 0 0;color:var(--muted)}.layout{display:grid;grid-template-columns:245px 1fr;gap:22px}.sidebar{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;height:max-content;position:sticky;top:90px}.side-item{width:100%;text-align:left;background:transparent;padding:12px;border-radius:10px;color:#45564a;font-weight:650;margin:2px 0}.side-item.active,.side-item:hover{background:var(--lime);color:var(--green)}.content{min-width:0}.field{display:flex;flex-direction:column;gap:7px;margin:13px 0}.field label{font-weight:700;font-size:13px;color:#435348}.field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1px solid #d6e1d8;border-radius:10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #19875418}.form-card{max-width:490px;margin:35px auto}.form-card h2{margin-top:0;color:var(--green)}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:var(--lime);color:var(--green);font-size:12px;font-weight:800}.warning{background:#fff7e6;color:#8a5a00}.dangerpill{background:#fff0f0;color:#a52a2a}.scanner{display:grid;grid-template-columns:1fr 1fr;gap:20px}.uploadbox{border:2px dashed #b9d2bf;background:#fbfefb;border-radius:17px;padding:25px;text-align:center;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center}.uploadbox img{max-width:100%;max-height:230px;border-radius:12px;object-fit:contain}.uploadbox input{max-width:100%;margin-top:16px}.result{border-left:4px solid var(--green2)}.product img{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#edf5ee}.product{display:flex;flex-direction:column;gap:10px}.product .price{font-size:20px;font-weight:800;color:var(--green)}.product-actions{display:flex;gap:8px;margin-top:auto}.product-actions button{flex:1}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:14px}th{background:#f3f8f3;color:var(--green)}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:35px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#183d27;color:#fff;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20}.footer{padding:35px 5%;background:#103c22;color:#dcece0;margin-top:55px}.footer strong{font-size:18px}.footer p{color:#bfd5c4}.modalback{position:fixed;inset:0;background:#0b2114a8;display:grid;place-items:center;padding:20px;z-index:15}.modal{background:#fff;border-radius:18px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#edf5ee;border-radius:9px;padding:7px 11px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.small{font-size:12px}.cartbar{background:#eaf5ec;padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
@media(max-width:850px){.nav{display:none}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto}.side-item{white-space:nowrap;width:auto}.scanner{grid-template-columns:1fr}}
@media(max-width:560px){.hero{padding:55px 7%;min-height:400px}.grid,.grid.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.topbar{padding:0 16px}.brand{font-size:14px}.container{padding:24px 15px}.page-title{align-items:flex-start;flex-direction:column}.hero p{font-size:16px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const KEY='plantHealthDemoV1';
const AI_API_URL='https://ai-powered-plant-health-analytics-engine-026t.onrender.com/predict';
const seed={
 users:[{id:'u-admin',name:'Administrator',email:'admin@planthealth.local',password:'admin123',role:'admin',village:'Bengaluru'},{id:'u-farmer',name:'Demo Farmer',email:'farmer@demo.com',password:'farmer123',role:'farmer',village:'Hoskote'}],
 products:[
 {id:'p1',name:'Neem Oil Spray',category:'Organic Protection',price:249,stock:25,description:'Plant-based support for common garden pest management.',image:'https://images.unsplash.com/photo-1605000797499-95a51c5269ae?auto=format&fit=crop&w=700&q=80'},
 {id:'p2',name:'Organic Vermicompost',category:'Fertilizers',price:199,stock:40,description:'Organic soil conditioner for healthy plant growth.',image:'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?auto=format&fit=crop&w=700&q=80'},
 {id:'p3',name:'Copper Fungicide',category:'Plant Care',price:325,stock:18,description:'Demonstration product listing. Follow label directions and local guidance.',image:'https://images.unsplash.com/photo-1589923188900-85dae523342b?auto=format&fit=crop&w=700&q=80'}
 ],
 diagnoses:[],orders:[],cart:[],posts:[]
};
let db=loadDB(),currentUser=null,active='home',scanImage='',selectedPlantFile=null,lastDiagnosis=null,adminTab='overview';
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){return JSON.parse(JSON.stringify(seed))}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₹'+Number(n).toLocaleString('en-IN')}
function toast(s){const el=document.getElementById('toastRoot');el.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>el.innerHTML='',2600)}
function go(p){active=p;render()}
function nav(){return `<header class="topbar"><div class="brand"><div class="logo">🌿</div><span>Plant Health Analytics</span></div><nav class="nav"><button class="${active==='home'?'active':''}" onclick="go('home')">Home</button><button onclick="go('scanner')">AI Scanner</button><button onclick="go('products')">Products</button><button onclick="go('community')">Community</button></nav><div class="row">${currentUser?`<button class="secondary" onclick="go('${currentUser.role==='admin'?'admin':'dashboard'}')">${currentUser.role==='admin'?'Admin Panel':'Dashboard'}</button><button class="linkbtn" onclick="logout()">Logout</button>`:`<button class="linkbtn" onclick="go('login')">Login</button><button class="primary" onclick="go('register')">Get Started</button>`}</div></header>`}
function footer(){return `<footer class="footer"><strong>🌱 AI-Powered Plant Health Analytics Engine</strong><p>Smart farming starts with healthy plants. This is an academic prototype. AI predictions are limited to the model's trained classes and should be confirmed by an agricultural expert.</p><span class="small">© 2026 Plant Health Analytics · Academic prototype</span></footer>`}
function home(){return `<section class="hero"><div class="hero-inner"><span class="eyebrow">🌱 SMART AGRICULTURE PLATFORM</span><h1>Healthy Plants.<br>Smarter Farming.</h1><p>Explore a digital farming assistant that demonstrates plant health scanning, crop care guidance and agricultural product management in one place.</p><div class="hero-actions"><button class="primary" onclick="go('scanner')">Start Plant Scan →</button><button class="secondary" onclick="go('products')">Explore Products</button></div></div></section><main class="container"><div class="section-head"><div><h2>Everything a farmer needs</h2><p>Simple tools designed to support better farming decisions.</p></div></div><div class="grid"><div class="card"><div class="feature-icon">📷</div><h3>Plant Health Scanner</h3><p>Upload a crop image and explore a AI-assisted plant image classification and crop-care guidance.</p><button class="linkbtn" onclick="go('scanner')">Try scanner →</button></div><div class="card"><div class="feature-icon">🧑‍🌾</div><h3>Farmer Dashboard</h3><p>View scan history, plant health activity and a personalized farmer workspace.</p><button class="linkbtn" onclick="requireLogin('dashboard')">Open dashboard →</button></div><div class="card"><div class="feature-icon">🛒</div><h3>Agri Product Store</h3><p>Browse demonstration listings and add products to your local shopping cart.</p><button class="linkbtn" onclick="go('products')">Browse products →</button></div></div><div class="section-head"><div><h2>How it works</h2><p>A simple four-step demonstration.</p></div></div><div class="grid"><div class="card"><span class="pill">STEP 01</span><h3>Upload a plant photo</h3><p>Select a clear image of the affected leaf or crop.</p></div><div class="card"><span class="pill">STEP 02</span><h3>Select the crop</h3><p>Choose the crop type from the supported demonstration list.</p></div><div class="card"><span class="pill">STEP 03</span><h3>View AI result</h3><p>See a model prediction with confidence and supported class.</p></div></div><div class="section-head"><div><h2>Supported crop categories</h2><p>Designed to expand as the real AI model is integrated.</p></div></div><div class="row">${['Tomato','Potato','Rice','Grapes','Apple','Chilli','Corn','Cotton','Wheat'].map(x=>`<span class="pill">${x}</span>`).join(' ')}</div></main>`}
function login(){return `<main class="container"><div class="card form-card"><h2>Welcome back</h2><p class="muted">Sign in to continue to your farming workspace.</p><form onsubmit="doLogin(event)"><div class="field"><label>Email address</label><input id="loginEmail" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="loginPass" type="password" required placeholder="Enter password"></div><button class="primary" style="width:100%">Login</button></form><p class="muted small">Demo farmer: farmer@demo.com / farmer123<br>Demo admin: admin@planthealth.local / admin123</p><p>New here? <button class="linkbtn" onclick="go('register')">Create an account</button></p></div></main>`}
function register(){return `<main class="container"><div class="card form-card"><h2>Create farmer account</h2><p class="muted">Register to save scans and explore the dashboard.</p><form onsubmit="doRegister(event)"><div class="field"><label>Full name</label><input id="regName" required></div><div class="field"><label>Email</label><input id="regEmail" type="email" required></div><div class="field"><label>Village / Town</label><input id="regVillage" required></div><div class="field"><label>Password</label><input id="regPass" type="password" minlength="6" required></div><button class="primary" style="width:100%">Create account</button></form><p>Already registered? <button class="linkbtn" onclick="go('login')">Login</button></p></div></main>`}
function dashboard(){if(!currentUser)return login();let mine=db.diagnoses.filter(d=>d.userId===currentUser.id);let healthy=mine.filter(d=>d.status==='Healthy').length;return `<main class="container"><div class="page-title"><div><h1>Farmer Dashboard</h1><p>Welcome back, ${esc(currentUser.name)}. Here's your activity overview.</p></div><button class="primary" onclick="go('scanner')">＋ New plant scan</button></div><div class="stats"><div class="stat"><small>Total scans</small><strong>${mine.length}</strong></div><div class="stat"><small>Healthy results</small><strong>${healthy}</strong></div><div class="stat"><small>Attention needed</small><strong>${mine.length-healthy}</strong></div><div class="stat"><small>Products in cart</small><strong>${db.cart.filter(x=>x.userId===currentUser.id).reduce((a,x)=>a+x.qty,0)}</strong></div></div><div class="section-head"><div><h2>Recent diagnoses</h2><p>Your locally saved scan history.</p></div><button class="secondary" onclick="go('history')">View all</button></div>${mine.length?diagnosisTable(mine.slice().reverse().slice(0,5)):`<div class="card empty">No scans yet. Upload your first plant image to get started.</div>`}<div class="section-head"><div><h2>Quick actions</h2></div></div><div class="grid"><div class="card"><div class="feature-icon">📷</div><h3>Scan a plant</h3><p>Start a new sample plant health assessment.</p><button class="secondary" onclick="go('scanner')">Open scanner</button></div><div class="card"><div class="feature-icon">🛍️</div><h3>Shop products</h3><p>Browse available agriculture products.</p><button class="secondary" onclick="go('products')">Visit store</button></div><div class="card"><div class="feature-icon">👤</div><h3>Your profile</h3><p>${esc(currentUser.email)}<br>${esc(currentUser.village||'')}</p></div></div></main>`}
function scanner(){return `<main class="container"><div class="page-title"><div><h1>AI Plant Health Scanner</h1><p>Upload a clear leaf image for model-based disease classification.</p></div><span class="pill">REAL MODEL API</span></div><div class="card" style="margin-bottom:18px;background:#eef8ef;border-color:#c9e4ce"><strong>AI model connection</strong><p class="muted" style="margin:6px 0 0">This scanner sends your selected image to the online Render FastAPI service. Predictions are limited to the classes learned by your trained AI model.</p></div><div class="scanner"><div class="card"><h3>1. Upload plant image</h3><div class="uploadbox" id="uploadBox">${scanImage?`<img src="${scanImage}" alt="Selected plant image">`:`<div style="font-size:45px">🍃</div><strong>Choose a plant or leaf photo</strong><p class="muted small">JPG, PNG or WEBP · max 5 MB</p>`}<input id="plantFile" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewImage(event)"></div><button class="primary" style="width:100%;margin-top:16px" onclick="runAIScan()">Analyze image with AI</button><p class="muted small">Online AI API: ai-powered-plant-health-analytics-engine-026t.onrender.com</p></div><div id="scanResult" class="card"><div class="feature-icon">🧠</div><h3>AI result will appear here</h3><p>Upload a leaf image and select Analyze image with AI.</p></div></div></main>`}
function previewImage(e){
 const input=e.target;
 const file=input.files && input.files[0];
 if(!file)return;
 if(!file.type.startsWith('image/')){
  toast('Please select an image file');
  input.value='';
  selectedPlantFile=null;
  return;
 }
 if(file.size>5*1024*1024){
  toast('Please choose an image smaller than 5 MB');
  input.value='';
  selectedPlantFile=null;
  return;
 }
 selectedPlantFile=file;
 const reader=new FileReader();
 reader.onload=()=>{
  scanImage=reader.result;
  const box=document.getElementById('uploadBox');
  if(!box)return;     
  let preview=box.querySelector('img');
  if(!preview){
   preview=document.createElement('img');
   preview.alt='Selected plant image';
   box.insertBefore(preview,input);
  }
  preview.src=scanImage;
  Array.from(box.children).forEach(child=>{
   if(child!==input && child!==preview)child.remove();
  });
  toast('Plant image uploaded successfully');
 };
 reader.onerror=()=>toast('Unable to read the selected image');
 reader.readAsDataURL(file);
}
async function runAIScan(){
 const file=selectedPlantFile || document.getElementById('plantFile')?.files?.[0];
 if(!file){toast('Please upload a plant image first');return}
 const panel=document.getElementById('scanResult');
 panel.innerHTML='<div class="feature-icon">⏳</div><h3>Analyzing leaf image…</h3><p class="muted">The AI model is processing your image. Please wait.</p>';
 const form=new FormData();form.append('file',file);
 try{
  const response=await fetch(AI_API_URL,{method:'POST',body:form});
  const raw=await response.text();
  let data={};
  try{data=raw?JSON.parse(raw):{}}catch(_){throw new Error('The AI server returned an invalid response. Please try again later.')}
  if(!response.ok)throw new Error(data.detail||data.message||('AI server error ('+response.status+')'));
  const label=data.prediction||'Unable to identify';

  // Handle the API's explicit no-leaf response separately from disease predictions.
  if(data.status==='no_leaf'){
   const confidence=Math.round((Number(data.confidence)||0)*100);
   panel.innerHTML=`<div class="result" style="padding-left:17px"><span class="pill warning">LEAF NOT DETECTED</span><h2 style="color:var(--green)">Please upload a clear plant leaf photo</h2><p>${esc(label)}</p><p class="muted">Model confidence for this background class: ${confidence}%</p><p class="small muted">Try a close-up photo of one leaf in good lighting, with less soil and background visible.</p></div>`;
   toast('No clear plant leaf detected');
   return;
  }

  const parts=label.split('___');const crop=(parts[0]||'Unknown').replaceAll('_',' ');
  const disease=(parts[1]||'').replaceAll('_',' ').trim();
  const healthy=/healthy/i.test(disease);
  const confidence=Math.round((data.confidence||0)*100);
  const uncertain=data.status==='uncertain';
  const diagnosis={id:'d'+Date.now(),userId:currentUser?.id||'guest',crop,disease:uncertain?'Unable to identify confidently':(disease||label),status:uncertain?'Needs expert review':(healthy?'Healthy':'Needs Attention'),confidence,severity:healthy?'Low':'Requires review',image:scanImage,date:new Date().toISOString(),symptoms:uncertain?'The model could not make a confident classification.':'The model classified the uploaded leaf image as '+label+'.',cause:'The model predicts a visual class; it does not confirm the biological cause.',treatment:'Do not apply pesticides based only on this automated result. Confirm with a local agriculture officer or qualified plant pathologist.',prevention:'Use clean planting material, monitor the crop regularly and follow local agricultural guidance.',model:'MobileNetV2 trained on PlantVillage'};
  lastDiagnosis=diagnosis;if(currentUser){db.diagnoses.push(diagnosis);save()}
  panel.innerHTML=aiResultCard(diagnosis,label,data);toast('AI analysis completed');
 }catch(err){panel.innerHTML='<div class="result" style="padding-left:17px"><span class="pill dangerpill">CONNECTION ERROR</span><h3>Could not reach the AI model</h3><p>'+esc(err.message)+'</p><p class="muted small">Check your internet connection and the online Render AI service. If the service has been idle, wait for it to wake up and try again.</p></div>';toast('AI server not connected')}
}
function aiResultCard(d,label,data){return `<div class="result" style="padding-left:17px"><div class="row"><span class="pill">MODEL PREDICTION</span><span class="pill">${esc(d.crop)}</span></div><h2 style="color:var(--green);margin-bottom:4px">${esc(d.disease)}</h2><p class="muted">Model confidence: ${d.confidence}% · ${esc(d.severity)}</p>${d.image?`<img src="${d.image}" style="width:100%;height:145px;object-fit:cover;border-radius:12px;margin:10px 0">`:''}<p><strong>Predicted class:</strong> ${esc(label)}</p><p><strong>Status:</strong> ${esc(d.status)}</p><p style="margin-top:12px"><strong>Interpretation</strong><br>${esc(d.symptoms)}</p><p style="margin-top:12px"><strong>Important</strong><br>${esc(d.treatment)}</p><p class="small muted" style="margin-top:17px">AI decision-support only. PlantVillage images are mostly controlled-background images; field performance may differ. Confirm important decisions with an agricultural expert.</p><button class="secondary" onclick="go('history')">View saved history</button></div>`}

function diagnosisTable(arr){return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Crop</th><th>Sample result</th><th>Status</th></tr></thead><tbody>${arr.map(d=>`<tr><td>${new Date(d.date).toLocaleDateString()}</td><td>${esc(d.crop)}</td><td>${esc(d.disease)}</td><td><span class="pill warning">${esc(d.status)}</span></td></tr>`).join('')}</tbody></table></div>`}
function history(){if(!currentUser)return login();let mine=db.diagnoses.filter(d=>d.userId===currentUser.id).slice().reverse();return `<main class="container"><div class="page-title"><div><h1>Diagnosis History</h1><p>Previously saved AI scan records.</p></div><button class="primary" onclick="go('scanner')">＋ New scan</button></div>${mine.length?diagnosisTable(mine):`<div class="card empty">No diagnosis history yet.</div>`}<p class="small muted">All records in this prototype are stored in this browser's local storage.</p></main>`}
function products(){return `<main class="container"><div class="page-title"><div><h1>Agriculture Products</h1><p>Explore sample products managed through the admin panel.</p></div><button class="secondary" onclick="go('cart')">🛒 Cart (${cartCount()})</button></div><div class="grid">${db.products.map(p=>`<div class="card product"><img src="${esc(p.image||'')}" alt="${esc(p.name)}" onerror="this.src='https://placehold.co/600x350/eaf5ec/14532d?text=Agri+Product'"><span class="pill">${esc(p.category)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="price">${money(p.price)}</div><div class="small muted">${p.stock>0?`${p.stock} in stock`:'Out of stock'}</div><div class="product-actions"><button class="primary" ${p.stock<1?'disabled':''} onclick="addCart('${p.id}')">Add to cart</button><button class="secondary" onclick="productDetails('${p.id}')">Details</button></div></div>`).join('')}</div></main>`}
function productDetails(id){const p=db.products.find(x=>x.id===id);if(!p)return;showModal(`<div class="modalhead"><h2>${esc(p.name)}</h2><button class="close" onclick="closeModal()">✕</button></div><img src="${esc(p.image)}" style="width:100%;height:180px;object-fit:cover;border-radius:12px"><p>${esc(p.description)}</p><h2 style="color:var(--green)">${money(p.price)}</h2><p class="muted">Stock: ${p.stock}</p><button class="primary" onclick="addCart('${p.id}');closeModal()">Add to cart</button>`)}
function cartCount(){return db.cart.filter(x=>x.userId===(currentUser?.id||'guest')).reduce((a,x)=>a+x.qty,0)}
function addCart(id){if(!currentUser){toast('Please login to use the cart');go('login');return}let line=db.cart.find(x=>x.userId===currentUser.id&&x.productId===id);if(line)line.qty++;else db.cart.push({userId:currentUser.id,productId:id,qty:1});save();toast('Added to cart');if(active==='products')render()}
function cart(){if(!currentUser)return login();let lines=db.cart.filter(x=>x.userId===currentUser.id),total=0;return `<main class="container"><div class="page-title"><div><h1>Your Shopping Cart</h1><p>Local demonstration cart.</p></div><button class="secondary" onclick="go('products')">Continue shopping</button></div>${lines.length?`<div class="card">${lines.map(l=>{let p=db.products.find(x=>x.id===l.productId);if(!p)return '';total+=p.price*l.qty;return `<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><strong>${esc(p.name)}</strong><span class="muted">${money(p.price)} × ${l.qty}</span><span class="right"><button class="secondary" onclick="changeQty('${p.id}',-1)">−</button> <button class="secondary" onclick="changeQty('${p.id}',1)">＋</button></span></div>`}).join('')}<div class="cartbar"><strong>Total</strong><strong>${money(total)}</strong></div><button class="primary" onclick="checkout()">Place demo order</button><p class="small muted">Demo checkout only. No payment is collected.</p></div>`:`<div class="card empty">Your cart is empty.</div>`}</main>`}
function changeQty(id,delta){let l=db.cart.find(x=>x.userId===currentUser.id&&x.productId===id);if(!l)return;l.qty+=delta;if(l.qty<=0)db.cart=db.cart.filter(x=>x!==l);save();render()}
function checkout(){let lines=db.cart.filter(x=>x.userId===currentUser.id);if(!lines.length)return;const total=lines.reduce((a,l)=>a+(db.products.find(p=>p.id===l.productId)?.price||0)*l.qty,0);db.orders.push({id:'ORD'+Date.now(),userId:currentUser.id,items:lines.map(x=>({...x})),total,status:'Demo order placed',date:new Date().toISOString()});db.cart=db.cart.filter(x=>x.userId!==currentUser.id);save();toast('Demo order placed successfully');go('orders')}
function orders(){if(!currentUser)return login();let list=db.orders.filter(o=>o.userId===currentUser.id).reverse();return `<main class="container"><div class="page-title"><div><h1>My Orders</h1><p>Orders placed in this local prototype.</p></div><button class="secondary" onclick="go('products')">Shop products</button></div>${list.length?`<div class="tablewrap"><table><thead><tr><th>Order ID</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>${list.map(o=>`<tr><td>${o.id}</td><td>${new Date(o.date).toLocaleDateString()}</td><td>${money(o.total)}</td><td><span class="pill">${esc(o.status)}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="card empty">No orders placed yet.</div>`}</main>`}
function community(){return `<main class="container"><div class="page-title"><div><h1>Farmer Community</h1><p>Share farming questions and learn from others (local demo feed).</p></div>${currentUser?'<button class="primary" onclick="newPost()">＋ Create post</button>':''}</div>${db.posts.length?db.posts.slice().reverse().map(p=>`<div class="card" style="margin-bottom:14px"><strong>${esc(p.name)}</strong><span class="small muted"> · ${new Date(p.date).toLocaleString()}</span><p style="margin-top:12px">${esc(p.text)}</p></div>`).join(''):`<div class="card empty">No community posts yet. Login to create the first post.</div>`}</main>`}
function newPost(){showModal(`<div class="modalhead"><h2>Create community post</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="savePost(event)"><div class="field"><label>Your question or update</label><textarea id="postText" rows="4" required></textarea></div><button class="primary">Publish post</button></form>`)}
function savePost(e){e.preventDefault();db.posts.push({id:Date.now(),userId:currentUser.id,name:currentUser.name,text:document.getElementById('postText').value,date:new Date().toISOString()});save();closeModal();render();toast('Post published')}
function admin(){if(!currentUser||currentUser.role!=='admin')return `<main class="container"><div class="card empty">Administrator access required. <button class="primary" onclick="go('login')">Login as admin</button></div></main>`;let tabs=['overview','products','users','diagnoses','orders'];return `<main class="container"><div class="page-title"><div><h1>Admin Control Panel</h1><p>Manage the local prototype and review activity.</p></div><span class="pill">ADMIN</span></div><div class="layout"><aside class="sidebar">${tabs.map(t=>`<button class="side-item ${adminTab===t?'active':''}" onclick="adminTab='${t}';render()">${({overview:'📊 Overview',products:'📦 Products',users:'👥 Users',diagnoses:'🔬 Scan Records',orders:'🛒 Orders'})[t]}</button>`).join('')}</aside><section class="content">${adminContent()}</section></div></main>`}
function adminContent(){if(adminTab==='overview')return `<div class="stats"><div class="stat"><small>Registered users</small><strong>${db.users.length}</strong></div><div class="stat"><small>Plant scans</small><strong>${db.diagnoses.length}</strong></div><div class="stat"><small>Products</small><strong>${db.products.length}</strong></div><div class="stat"><small>Demo orders</small><strong>${db.orders.length}</strong></div></div><div class="card" style="margin-top:18px"><h3>Project demonstration status</h3><p class="muted">The scanner is configured to send images to the deployed Render AI model API. User accounts, products, orders and scan history in this prototype are stored locally in this browser; Firebase authentication, shared cloud storage and real payments are not connected.</p></div>`;if(adminTab==='products')return `<div class="row" style="margin-bottom:14px"><h2 style="margin:0;color:var(--green)">Manage Products</h2><button class="primary right" onclick="editProduct()">＋ Add product</button></div><div class="tablewrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><button class="secondary" onclick="editProduct('${p.id}')">Edit</button> <button class="danger" onclick="deleteProduct('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`;if(adminTab==='users')return `<h2 style="color:var(--green)">Registered users</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Village</th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td><td>${esc(u.village||'-')}</td></tr>`).join('')}</tbody></table></div>`;if(adminTab==='diagnoses')return `<h2 style="color:var(--green)">All scan records</h2>${db.diagnoses.length?diagnosisTable(db.diagnoses.slice().reverse()):'<div class="card empty">No scans recorded.</div>'}`;return `<h2 style="color:var(--green)">Demo orders</h2>${db.orders.length?`<div class="tablewrap"><table><thead><tr><th>Order</th><th>Farmer</th><th>Total</th><th>Status</th></tr></thead><tbody>${db.orders.map(o=>`<tr><td>${o.id}</td><td>${esc(db.users.find(u=>u.id===o.userId)?.name||'User')}</td><td>${money(o.total)}</td><td>${esc(o.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No orders yet.</div>'}`}
function editProduct(id=''){let p=db.products.find(x=>x.id===id)||{name:'',category:'Fertilizers',price:0,stock:0,description:'',image:''};showModal(`<div class="modalhead"><h2>${id?'Edit':'Add'} product</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveProduct(event,'${id}')"><div class="field"><label>Product name</label><input id="pn" value="${esc(p.name)}" required></div><div class="field"><label>Category</label><input id="pc" value="${esc(p.category)}" required></div><div class="field"><label>Price (₹)</label><input id="pp" type="number" min="0" value="${p.price}" required></div><div class="field"><label>Stock</label><input id="ps" type="number" min="0" value="${p.stock}" required></div><div class="field"><label>Description</label><textarea id="pd" required>${esc(p.description)}</textarea></div><div class="field"><label>Image URL</label><input id="pi" value="${esc(p.image)}" placeholder="https://..."></div><button class="primary">Save product</button></form>`)}
function saveProduct(e,id){e.preventDefault();let p={id:id||'p'+Date.now(),name:document.getElementById('pn').value,category:document.getElementById('pc').value,price:Number(document.getElementById('pp').value),stock:Number(document.getElementById('ps').value),description:document.getElementById('pd').value,image:document.getElementById('pi').value};if(id)db.products=db.products.map(x=>x.id===id?p:x);else db.products.push(p);save();closeModal();render();toast('Product saved')}
function deleteProduct(id){if(!confirm('Delete this product?'))return;db.products=db.products.filter(p=>p.id!==id);save();render();toast('Product deleted')}
function doLogin(e){e.preventDefault();let u=db.users.find(x=>x.email.toLowerCase()===document.getElementById('loginEmail').value.toLowerCase()&&x.password===document.getElementById('loginPass').value);if(!u){toast('Incorrect email or password');return}currentUser=u;toast('Welcome, '+u.name);go(u.role==='admin'?'admin':'dashboard')}
function doRegister(e){e.preventDefault();let email=document.getElementById('regEmail').value.trim().toLowerCase();if(db.users.some(u=>u.email.toLowerCase()===email)){toast('Email already registered');return}let u={id:'u'+Date.now(),name:document.getElementById('regName').value,email,password:document.getElementById('regPass').value,village:document.getElementById('regVillage').value,role:'farmer'};db.users.push(u);save();currentUser=u;toast('Account created');go('dashboard')}
function logout(){currentUser=null;go('home');toast('Logged out')}
function requireLogin(p){if(!currentUser){go('login');return}go(p)}
function showModal(content){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function render(){let pages={home,login,register,dashboard,scanner,history,products,cart,orders,community,admin};document.getElementById('app').innerHTML=nav()+(pages[active]||home)()+footer();window.scrollTo(0,0)}
render();
</script>
</body>
</html>
